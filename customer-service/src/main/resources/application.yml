server:
  port: 8056

spring:
  application:
    name: customer-service
  cloud:
    config:
      enabled: false   # <--- Add this line to disable the config server check
      discovery:
        enabled: true
  datasource:
    url: jdbc:h2:mem:customers-db
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  ai:
    mcp:
      server:
        protocol: streamable

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

management:
  endpoints:
    web:
      exposure:
        include: "*"